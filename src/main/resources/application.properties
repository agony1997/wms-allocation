# =============================================
# 應用程式基本設定
# =============================================
spring.application.name=wms-allocation
server.port=8080
# 終端機輸出啟用 ANSI 色彩
spring.output.ansi.enabled=always

# =============================================
# 資料庫連線（SQL Server，由 docker-compose 啟動）
# =============================================
# encrypt=true：JDBC Driver 10+ 預設強制加密連線
# trustServerCertificate=true：信任容器的自簽憑證（僅限本機開發，正式環境應使用有效憑證）
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=wms_allocation;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# 每次啟動執行 data.sql 插入測試資料
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.mode=always

# =============================================
# 連線池（HikariCP，Spring Boot 預設連線池）
# =============================================
# 最大連線數
spring.datasource.hikari.maximum-pool-size=10
# 最少保留的閒置連線數
spring.datasource.hikari.minimum-idle=2
# 取得連線的等待逾時（毫秒），超過拋出例外
spring.datasource.hikari.connection-timeout=30000
# 閒置連線多久後回收（毫秒）
spring.datasource.hikari.idle-timeout=600000
# 連線最長存活時間（毫秒），避免被資料庫端先斷線
spring.datasource.hikari.max-lifetime=1800000

# =============================================
# JPA / Hibernate
# =============================================
# 延後 data.sql 執行時機：等 Hibernate 依 Entity 建完資料表後再插資料（搭配 ddl-auto=create 必須開啟）
spring.jpa.defer-datasource-initialization=true
# create：每次啟動刪除並重建所有資料表（學習專案用；正式環境應改用 validate + migration 工具）
spring.jpa.hibernate.ddl-auto=create
# 是否在 console 印出 Hibernate 產生的 SQL
spring.jpa.show-sql=false
# 印出的 SQL 自動排版（搭配 show-sql=true 才有意義）
spring.jpa.properties.hibernate.format_sql=true
# 指定 SQL Server 方言（Hibernate 6 其實可自動偵測，明確指定是為了可讀性）
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
# 關閉 Open Session In View：避免 View 層觸發 lazy loading，強迫在 Service 層處理好資料載入
spring.jpa.open-in-view=false

# =============================================
# Logging
# =============================================
# TRACE 等級可印出 SQL 綁定的參數值（搭配 show-sql 除錯用）
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
#  %clr(%-5level) 會自動根據 Log 等級變色 (INFO=綠, WARN=黃, ERROR=紅)
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr([%thread]){magenta} %clr(%-5level) %clr(%logger{36}){cyan} - %msg%n

# =============================================
# Actuator（監控端點）
# =============================================
# 對外開放的端點：http://localhost:8080/actuator/{health|info|metrics}
management.endpoints.web.exposure.include=health,info,metrics
# health 顯示完整細節（含資料庫連線狀態）
management.endpoint.health.show-details=always

# JWT 簽章密鑰，由環境變數 JWT_SECRET 注入（見 .env / docs/development.md）；未設定則啟動失敗
jwt.secret=${JWT_SECRET}